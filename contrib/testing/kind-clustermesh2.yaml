cluster:
  name: clustermesh2
  id: 2
debug:
  enabled: true
image:
  pullPolicy: Never
operator:
  image:
    pullPolicy: Never
ipam:
  mode: kubernetes
ipv6:
  enabled: true
ipv4:
  enabled: true
bpf:
  monitorAggregation: none
livenessProbe:
  failureThreshold: 9999
readinessProbe:
  failureThreshold: 9999
startupProbe:
  failureThreshold: 9999

# TLS configuration - DO NOT share CA key, only trust bundle
tls:
  ca:
    cert: ""
    key: ""
  caBundle:
    enabled: true
    name: cilium-root-ca.crt
    key: ca.crt
    useSecret: false

# Hubble TLS - disable auto-generation
hubble:
  tls:
    auto:
      enabled: false
    server:
      existingSecret: hubble-server-certs
  relay:
    tls:
      client:
        existingSecret: hubble-relay-client-certs

clustermesh:
  useAPIServer: true
  config:
    enabled: true
  apiserver:
    image:
      pullPolicy: Never
    service:
      nodePort: 32380
    readinessProbe:
      periodSeconds: 1
    kvstoremesh:
      readinessProbe:
        periodSeconds: 1
    tls:
      authMode: cluster
      auto:
        enabled: false